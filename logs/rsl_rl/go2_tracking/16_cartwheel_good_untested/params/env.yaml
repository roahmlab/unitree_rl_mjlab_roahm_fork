          frictionloss: 0.0
          stiffness: 20.0
          damping: 1.0
          effort_limit: 23.5
          saturation_effort: 23.5
          velocity_limit: 30.0
        - target_names_expr: !!python/tuple
          - .*thigh_.*
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.01
          frictionloss: 0.0
          stiffness: 20.0
          damping: 1.0
          effort_limit: 23.5
          saturation_effort: 23.5
          velocity_limit: 30.0
        - target_names_expr: !!python/tuple
          - .*calf_.*
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.02
          frictionloss: 0.0
          stiffness: 40.0
          damping: 2.0
          effort_limit: 45.0
          saturation_effort: 45.0
          velocity_limit: 30.0
        soft_joint_pos_limit_factor: 0.9
